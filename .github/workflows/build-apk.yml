              private val GEMINI_API_KEY = "ضع_مفتاح_الـ_API_هنا"

              private val PERMISSION_REQUEST_CODE = 123
              private lateinit var rvSongs: RecyclerView
              private lateinit var rvFolders: RecyclerView
