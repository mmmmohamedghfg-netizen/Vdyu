              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  rvSongs = findViewById(R.id.rvSongs)
                  rvFolders = findViewById(R.id.rvFolders)
                  rvPlaylists = findViewById(R.id.rvPlaylists)
                  layoutPlaylists = findViewById(R.id.layoutPlaylists)
                  fabAddPlaylist = findViewById(R.id.fabAddPlaylist)
                  fabAiMood = findViewById(R.id.fabAiMood)

                  miniPlayer = findViewById(R.id.miniPlayer)
                  tvMiniTitle = findViewById(R.id.tvMiniTitle)
                  tvMiniArtist = findViewById(R.id.tvMiniArtist)
                  btnMiniPlay = findViewById(R.id.btnMiniPlay)

                  playerScreen = findViewById(R.id.playerScreen)
                  tvFullTitle = findViewById(R.id.tvFullTitle)
                  tvFullArtist = findViewById(R.id.tvFullArtist)
                  seekBarPlay = findViewById(R.id.seekBarPlay)
                  tvCurrentTime = findViewById(R.id.tvCurrentTime)
                  tvTotalTime = findViewById(R.id.tvTotalTime)
                  btnPlay = findViewById(R.id.btnPlay)
                  knobOuter = findViewById(R.id.knobOuter)

                  rvSongs.layoutManager = LinearLayoutManager(this)
                  rvFolders.layoutManager = LinearLayoutManager(this)
                  rvPlaylists.layoutManager = LinearLayoutManager(this)

                  setupNavigationTabs()
                  setupPlayerControls()
                  setupFavoritesAndPlaylists()
                  
