name: Build Android APK with AI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/aipromusic/player
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.1.1" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AiProMusicPlayer"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }

          android {
              namespace = "com.aipromusic.player"
              compileSdk = 34
              defaultConfig { applicationId = "com.aipromusic.player"; minSdk = 24; targetSdk = 34; versionCode = 3; versionName = "3.0 API Edition" }
              buildTypes { release { isMinifyEnabled = false; proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = "1.8" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("com.google.ai.client.generativeai:generativeai:0.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aipromusic.player">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application android:allowBackup="true" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:label="Ai Pro Music" android:supportsRtl="true" android:theme="@style/Theme.AiProMusicPlayer">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter> <action android:name="android.intent.action.MAIN" /> <category android:name="android.intent.category.LAUNCHER" /> </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources><color name="dub_dark_grey">#1E1E24</color><color name="dub_black">#121214</color><color name="dub_darker_black">#09090A</color><color name="dub_red">#E53935</color><color name="dub_green">#76FF03</color><color name="text_white">#FFFFFF</color><color name="text_light_gray">#B0B0B0</color><color name="text_dim">#666666</color><color name="ai_blue">#00E5FF</color><color name="player_dark">#23232F</color></resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.AiProMusicPlayer" parent="Theme.MaterialComponents.DayNight.NoActionBar"><item name="colorPrimary">@color/dub_red</item><item name="colorPrimaryVariant">@color/dub_black</item><item name="colorOnPrimary">@color/text_white</item><item name="android:statusBarColor">@color/dub_darker_black</item><item name="android:windowBackground">@color/dub_black</item></style></resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_dub_panel.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:startColor="#2A2D34" android:endColor="#15171C" android:angle="270"/><corners android:radius="12dp"/><stroke android:width="1.5dp" android:color="#444855"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circular_knob.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><gradient android:type="radial" android:gradientRadius="140dp" android:startColor="#4A4E5A" android:endColor="#1E2024"/><stroke android:width="4dp" android:color="#0F1012"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_red_indicator.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/dub_red"/><corners android:radius="2dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#E53935" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/><path android:fillColor="#FFFFFF" android:pathData="M12 4c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm0 12.5c-2.48 0-4.5-2.02-4.5-4.5S9.52 7.5 12 7.5s4.5 2.02 4.5 4.5-2.02 4.5-4.5 4.5zm-1.5-6h3v4.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-4.5z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_song.xml
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="16dp" android:background="?attr/selectableItemBackground" android:gravity="center_vertical"><TextView android:id="@+id/tvIndex" android:layout_width="32dp" android:layout_height="wrap_content" android:text="01" android:textColor="@color/text_dim" android:textSize="14sp" android:textStyle="bold" /><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:orientation="vertical" android:layout_weight="1" android:layout_marginEnd="8dp"><TextView android:id="@+id/tvSongTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Song Title" android:textColor="@color/text_white" android:textSize="15sp" android:textStyle="bold" android:singleLine="true" android:ellipsize="marquee" /><TextView android:id="@+id/tvArtist" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Artist Name" android:textColor="@color/text_light_gray" android:textSize="13sp" android:layout_marginTop="2dp" android:singleLine="true" /></LinearLayout><ImageView android:id="@+id/btnFavorite" android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/btn_star_big_off" android:contentDescription="favorite" /></LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_folder.xml
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="16dp" android:background="?attr/selectableItemBackground" android:gravity="center_vertical"><ImageView android:layout_width="36dp" android:layout_height="36dp" android:src="@android:drawable/ic_menu_manage" android:tint="@color/text_light_gray"/><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:orientation="vertical" android:layout_weight="1" android:layout_marginStart="16dp"><TextView android:id="@+id/tvFolderName" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Folder Name" android:textColor="@color/text_white" android:textSize="16sp" android:textStyle="bold" /><TextView android:id="@+id/tvFolderCount" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="0 Songs" android:textColor="@color/text_dim" android:textSize="13sp" android:layout_marginTop="2dp" /></LinearLayout></LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_playlist.xml
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="16dp" android:background="?attr/selectableItemBackground" android:gravity="center_vertical"><ImageView android:layout_width="36dp" android:layout_height="36dp" android:src="@android:drawable/ic_menu_sort_by_size" android:tint="@color/dub_red" /><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:orientation="vertical" android:layout_weight="1" android:layout_marginStart="16dp"><TextView android:id="@+id/tvPlaylistName" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Playlist Name" android:textColor="@color/text_white" android:textSize="16sp" android:textStyle="bold" /></LinearLayout></LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/dialog_eq.xml
          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@color/dub_black" android:padding="20dp"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="استوديو الصوت (EQ &amp; 3D)" android:textColor="@color/text_white" android:textSize="20sp" android:textStyle="bold" android:gravity="center" android:layout_marginBottom="16dp"/><Button android:id="@+id/btnAiAutoTune" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="✨ تفعيل التحسين بالذكاء الاصطناعي ✨" android:backgroundTint="@color/ai_blue" android:textColor="@color/dub_black" android:textStyle="bold" android:layout_marginBottom="16dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="مضخم الصوت (Bass Boost)" android:textColor="@color/dub_red" android:layout_marginTop="8dp"/><SeekBar android:id="@+id/sbBass" android:layout_width="match_parent" android:layout_height="wrap_content" android:progressTint="@color/dub_red" android:thumbTint="@color/dub_red"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الصوت المحيطي (3D Virtualizer)" android:textColor="@color/dub_green" android:layout_marginTop="16dp"/><SeekBar android:id="@+id/sb3D" android:layout_width="match_parent" android:layout_height="wrap_content" android:progressTint="@color/dub_green" android:thumbTint="@color/dub_green"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="المعادل الصوتي (Equalizer)" android:textColor="@color/text_white" android:layout_marginTop="24dp" android:layout_marginBottom="8dp"/><LinearLayout android:id="@+id/eqContainer" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical"/><Button android:id="@+id/btnCloseEq" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="إغلاق" android:layout_marginTop="24dp" android:backgroundTint="@color/dub_dark_grey"/></LinearLayout></ScrollView>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/dub_darker_black">
              <RelativeLayout android:id="@+id/toolbar" android:layout_width="match_parent" android:layout_height="56dp" android:background="@color/dub_black" android:paddingHorizontal="16dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerVertical="true" android:text="Ai Pro Music 🎵" android:textColor="@color/text_white" android:textSize="20sp" android:textStyle="bold" />
              </RelativeLayout>
              <LinearLayout android:id="@+id/tabLayout" android:layout_width="match_parent" android:layout_height="48dp" android:layout_below="@id/toolbar" android:orientation="horizontal" android:background="@color/dub_black" android:weightSum="3">
                  <LinearLayout android:id="@+id/tabSongs" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:gravity="center" android:orientation="vertical">
                      <TextView android:id="@+id/tvTabSongs" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الأغاني" android:textColor="@color/text_white" android:textStyle="bold" />
                      <View android:id="@+id/indSongs" android:layout_width="48dp" android:layout_height="3dp" android:layout_marginTop="4dp" android:background="@color/dub_red" />
                  </LinearLayout>
                  <LinearLayout android:id="@+id/tabFolders" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:gravity="center" android:orientation="vertical">
                      <TextView android:id="@+id/tvTabFolders" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="المجلدات" android:textColor="@color/text_light_gray" />
                      <View android:id="@+id/indFolders" android:layout_width="48dp" android:layout_height="3dp" android:layout_marginTop="4dp" android:background="@android:color/transparent" />
                  </LinearLayout>
                  <LinearLayout android:id="@+id/tabPlaylists" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:gravity="center" android:orientation="vertical">
                      <TextView android:id="@+id/tvTabPlaylists" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="قوائم التشغيل" android:textColor="@color/text_light_gray" />
                      <View android:id="@+id/indPlaylists" android:layout_width="64dp" android:layout_height="3dp" android:layout_marginTop="4dp" android:background="@android:color/transparent" />
                  </LinearLayout>
              </LinearLayout>
              
              <FrameLayout android:id="@+id/container" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_below="@id/tabLayout" android:layout_above="@+id/miniPlayer">
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rvSongs" android:layout_width="match_parent" android:layout_height="match_parent" />
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rvFolders" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" />
                  <RelativeLayout android:id="@+id/layoutPlaylists" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone">
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rvPlaylists" android:layout_width="match_parent" android:layout_height="match_parent" />
                      <com.google.android.material.floatingactionbutton.FloatingActionButton android:id="@+id/fabAddPlaylist" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:layout_alignParentEnd="true" android:layout_margin="24dp" android:src="@android:drawable/ic_input_add" app:backgroundTint="@color/dub_red" app:tint="@color/text_white" />
                  </RelativeLayout>
              </FrameLayout>
              
              <com.google.android.material.floatingactionbutton.FloatingActionButton
                  android:id="@+id/fabAiMood"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_above="@+id/miniPlayer"
                  android:layout_alignParentEnd="true"
                  android:layout_margin="24dp"
                  android:src="@android:drawable/ic_menu_compass"
                  app:backgroundTint="@color/ai_blue"
                  app:tint="@color/dub_black" />

              <RelativeLayout android:id="@+id/miniPlayer" android:layout_width="match_parent" android:layout_height="72dp" android:layout_alignParentBottom="true" android:background="@color/dub_black" android:padding="8dp" android:visibility="gone">
                  <ImageView android:id="@+id/ivMiniIcon" android:layout_width="56dp" android:layout_height="56dp" android:src="@android:drawable/ic_media_play" android:tint="@color/dub_red" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_toEndOf="@id/ivMiniIcon" android:layout_toStartOf="@+id/btnMiniPlay" android:layout_marginStart="12dp" android:layout_centerVertical="true">
                      <TextView android:id="@+id/tvMiniTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Song Title" android:textColor="@color/text_white" android:textSize="14sp" android:textStyle="bold" android:singleLine="true" />
                      <TextView android:id="@+id/tvMiniArtist" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Artist" android:textColor="@color/text_light_gray" android:textSize="12sp" android:singleLine="true" />
                  </LinearLayout>
                  <ImageButton android:id="@+id/btnMiniPlay" android:layout_width="48dp" android:layout_height="48dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:background="?attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_media_pause" android:tint="@color/text_white" />
              </RelativeLayout>

              <RelativeLayout android:id="@+id/playerScreen" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/dub_darker_black" android:visibility="gone">
                  <RelativeLayout android:id="@+id/backBar" android:layout_width="match_parent" android:layout_height="56dp" android:paddingHorizontal="16dp">
                      <ImageButton android:id="@+id/btnBack" android:layout_width="48dp" android:layout_height="48dp" android:layout_centerVertical="true" android:background="?attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_menu_revert" android:tint="@color/text_white" />
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:text="المشغل الصوتي" android:textColor="@color/text_white" android:textSize="18sp" android:textStyle="bold" />
                  </RelativeLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:layout_below="@id/backBar" android:orientation="vertical" android:padding="24dp" android:gravity="center_horizontal" android:weightSum="10">
                      <TextView android:id="@+id/tvFullTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_weight="1" android:text="Song Title" android:textColor="@color/text_white" android:textSize="20sp" android:textStyle="bold" android:gravity="center" android:singleLine="true" />
                      <TextView android:id="@+id/tvFullArtist" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_weight="0.5" android:text="Artist Name" android:textColor="@color/text_light_gray" android:textSize="15sp" android:gravity="center" />
                      
                      <RelativeLayout android:layout_width="240dp" android:layout_height="240dp" android:layout_weight="5" android:layout_marginVertical="8dp" android:background="@drawable/bg_dub_panel" android:gravity="center">
                          <View android:id="@+id/knobOuter" android:layout_width="180dp" android:layout_height="180dp" android:background="@drawable/bg_circular_knob" />
                          <View android:id="@+id/knobPointer" android:layout_width="14dp" android:layout_height="14dp" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:layout_marginTop="32dp" android:background="@drawable/bg_red_indicator" />
                      </RelativeLayout>
                      
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center" android:layout_weight="0.5" android:layout_marginVertical="8dp">
                          <Button android:id="@+id/btnEq" android:layout_width="wrap_content" android:layout_height="wrap_content" text="🎚️ المعادل (EQ)" android:backgroundTint="@color/dub_dark_grey" android:textColor="@color/text_white"/>
                      </LinearLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="horizontal" android:gravity="center_vertical">
                          <TextView android:id="@+id/tvCurrentTime" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="00:00" android:textColor="@color/dub_green" android:textSize="12sp" />
                          <SeekBar android:id="@+id/seekBarPlay" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:progressTint="@color/dub_green" android:thumbTint="@color/dub_green" />
                          <TextView android:id="@+id/tvTotalTime" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="-00:00" android:textColor="@color/dub_red" android:textSize="12sp" />
                      </LinearLayout>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_weight="2" android:orientation="horizontal" android:gravity="center" android:layout_marginTop="4dp">
                          <ImageButton android:id="@+id/btnPrev" android:layout_width="56dp" android:layout_height="56dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_media_previous" android:tint="@color/text_white" />
                          <ImageButton android:id="@+id/btnPlay" android:layout_width="72dp" android:layout_height="72dp" android:layout_marginHorizontal="24dp" android:background="@drawable/bg_dub_panel" android:src="@android:drawable/ic_media_play" android:tint="@color/dub_green" />
                          <ImageButton android:id="@+id/btnNext" android:layout_width="56dp" android:layout_height="56dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_media_next" android:tint="@color/text_white" />
                      </LinearLayout>
                  </LinearLayout>
              </RelativeLayout>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/aipromusic/player/Song.kt
          package com.aipromusic.player
          data class Song(val id: Long, val title: String, val artist: String, val path: String, val folder: String, var isFavorite: Boolean = false)
          EOF

          cat << 'EOF' > app/src/main/java/com/aipromusic/player/SongAdapter.kt
          package com.aipromusic.player
          import android.view.LayoutInflater; import android.view.View; import android.view.ViewGroup; import android.widget.ImageView; import android.widget.TextView; import androidx.recyclerview.widget.RecyclerView
          class SongAdapter(private var songs: List<Song>, private val onSongClick: (Song) -> Unit, private val onFavoriteClick: (Song, Int) -> Unit) : RecyclerView.Adapter<SongAdapter.SongViewHolder>() {
              class SongViewHolder(view: View) : RecyclerView.ViewHolder(view) { val tvIndex: TextView = view.findViewById(R.id.tvIndex); val tvTitle: TextView = view.findViewById(R.id.tvSongTitle); val tvArtist: TextView = view.findViewById(R.id.tvArtist); val btnFav: ImageView = view.findViewById(R.id.btnFavorite) }
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): SongViewHolder = SongViewHolder(LayoutInflater.from(parent.context).inflate(R.layout.item_song, parent, false))
              override fun onBindViewHolder(holder: SongViewHolder, position: Int) { val song = songs[position]; holder.tvIndex.text = String.format("%02d", position + 1); holder.tvTitle.text = song.title; holder.tvArtist.text = song.artist; holder.btnFav.setImageResource(if (song.isFavorite) android.R.drawable.btn_star_big_on else android.R.drawable.btn_star_big_off); holder.itemView.setOnClickListener { onSongClick(song) }; holder.btnFav.setOnClickListener { onFavoriteClick(song, position) } }
              override fun getItemCount(): Int = songs.size
              fun updateList(newList: List<Song>) { songs = newList; notifyDataSetChanged() }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aipromusic/player/FolderAdapter.kt
          package com.aipromusic.player
          import android.view.LayoutInflater; import android.view.View; import android.view.ViewGroup; import android.widget.TextView; import androidx.recyclerview.widget.RecyclerView
          class FolderAdapter(private val folders: List<Pair<String, List<Song>>>, private val onFolderClick: (List<Song>) -> Unit) : RecyclerView.Adapter<FolderAdapter.FolderViewHolder>() {
              class FolderViewHolder(view: View) : RecyclerView.ViewHolder(view) { val tvFolderName: TextView = view.findViewById(R.id.tvFolderName); val tvFolderCount: TextView = view.findViewById(R.id.tvFolderCount) }
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): FolderViewHolder = FolderViewHolder(LayoutInflater.from(parent.context).inflate(R.layout.item_folder, parent, false))
              override fun onBindViewHolder(holder: FolderViewHolder, position: Int) { val (folderName, songs) = folders[position]; holder.tvFolderName.text = folderName; holder.tvFolderCount.text = "${songs.size} أغانٍ"; holder.itemView.setOnClickListener { onFolderClick(songs) } }
              override fun getItemCount(): Int = folders.size
          }
