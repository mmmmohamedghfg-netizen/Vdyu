              private fun showAiMoodDialog() {
                  if (GEMINI_API_KEY.startsWith("ضع_") || GEMINI_API_KEY.isEmpty()) {
                      Toast.makeText(this, "برجاء وضع API Key الخاص بك أولاً داخل الكود!", Toast.LENGTH_LONG).show()
                      return
                  }

                  val input = EditText(this)
                  input.hint = "مثال: محتاج أغاني حماسية للجيم"
                  AlertDialog.Builder(this)
                      .setTitle("✨ منسق الأغاني الذكي (AI DJ)")
                      .setMessage("اكتب مودك دلوقتي أو بتعمل إيه، والذكاء الاصطناعي هيعملك قائمة تشغيل مخصوصة من أغانيك!")
                      .setView(input)
                      .setPositiveButton("يلا بينا") { _, _ ->
                          val mood = input.text.toString().trim()
                          if (mood.isNotEmpty()) {
                              generateAiPlaylist(mood)
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun generateAiPlaylist(mood: String) {
                  Toast.makeText(this, "جاري تحليل الأغاني باستخدام الذكاء الاصطناعي... ⏳", Toast.LENGTH_LONG).show()
                  
                  lifecycleScope.launch {
                      try {
                          val model = GenerativeModel("gemini-1.5-flash", GEMINI_API_KEY)
                          
                          val songTitles = allSongs.map { it.title }.joinToString(", ")
                          
                          val prompt = "لدي هذه الأغاني على هاتفي: " + songTitles + ". \nالمستخدم يقول: '" + mood + "'. \nمن فضلك اختر فقط أسماء الأغاني التي تناسب هذا المود، وقم بالرد بأسماء الأغاني فقط مفصولة بفاصلة (,) بدون أي كلمات أخرى."
                          
                          val response = model.generateContent(prompt)
                          val aiText = response.text ?: ""
                          
                          val selectedTitles = aiText.split(",").map { it.trim() }
                          val aiPlaylist = allSongs.filter { selectedTitles.contains(it.title) }
                          
                          if (aiPlaylist.isNotEmpty()) {
                              currentPlaylist = aiPlaylist.toMutableList()
                              currentSongIndex = 0
                              playSong(currentPlaylist[0])
                              rvSongs.visibility = View.VISIBLE
                              rvFolders.visibility = View.GONE
                              layoutPlaylists.visibility = View.GONE
                              adapterSongs?.updateList(currentPlaylist)
                              Toast.makeText(this@MainActivity, "✨ تم تشغيل قائمة الذكاء الاصطناعي! (${aiPlaylist.size} أغنية)", Toast.LENGTH_LONG).show()
                          } else {
                              Toast.makeText(this@MainActivity, "لم يجد الذكاء الاصطناعي أغاني مطابقة تماماً للمود، جرب وصف تاني.", Toast.LENGTH_LONG).show()
                          }
                      } catch (e: Exception) {
                          Toast.makeText(this@MainActivity, "حدث خطأ في الاتصال بالذكاء الاصطناعي: " + e.message, Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun setupNavigationTabs() {
                  val tabSongs = findViewById<View>(R.id.tabSongs)
                  val tabFolders = findViewById<View>(R.id.tabFolders)
                  val tabPlaylists = findViewById<View>(R.id.tabPlaylists)
                  val tvTabSongs = findViewById<TextView>(R.id.tvTabSongs)
                  val tvTabFolders = findViewById<TextView>(R.id.tvTabFolders)
                  val tvTabPlaylists = findViewById<TextView>(R.id.tvTabPlaylists)
                  val indSongs = findViewById<View>(R.id.indSongs)
                  val indFolders = findViewById<View>(R.id.indFolders)
                  val indPlaylists = findViewById<View>(R.id.indPlaylists)

                  tabSongs.setOnClickListener {
                      rvSongs.visibility = View.VISIBLE; rvFolders.visibility = View.GONE; layoutPlaylists.visibility = View.GONE
                      tvTabSongs.setTextColor(resources.getColor(R.color.text_white))
                      tvTabFolders.setTextColor(resources.getColor(R.color.text_light_gray))
                      tvTabPlaylists.setTextColor(resources.getColor(R.color.text_light_gray))
                      indSongs.setBackgroundColor(resources.getColor(R.color.dub_red))
                      indFolders.setBackgroundColor(android.R.color.transparent)
                      indPlaylists.setBackgroundColor(android.R.color.transparent)
                      adapterSongs?.updateList(allSongs)
                  }
                  tabFolders.setOnClickListener {
                      rvSongs.visibility = View.GONE; rvFolders.visibility = View.VISIBLE; layoutPlaylists.visibility = View.GONE
                      tvTabSongs.setTextColor(resources.getColor(R.color.text_light_gray))
                      tvTabFolders.setTextColor(resources.getColor(R.color.text_white))
                      tvTabPlaylists.setTextColor(resources.getColor(R.color.text_light_gray))
                      indSongs.setBackgroundColor(android.R.color.transparent)
                      indFolders.setBackgroundColor(resources.getColor(R.color.dub_red))
                      indPlaylists.setBackgroundColor(android.R.color.transparent)
                      loadFolders()
                  }
                  tabPlaylists.setOnClickListener {
                      rvSongs.visibility = View.GONE; rvFolders.visibility = View.GONE; layoutPlaylists.visibility = View.VISIBLE
                      tvTabSongs.setTextColor(resources.getColor(R.color.text_light_gray))
                      tvTabFolders.setTextColor(resources.getColor(R.color.text_light_gray))
                      tvTabPlaylists.setTextColor(resources.getColor(R.color.text_white))
                      indSongs.setBackgroundColor(android.R.color.transparent)
                      indFolders.setBackgroundColor(android.R.color.transparent)
                      indPlaylists.setBackgroundColor(resources.getColor(R.color.dub_red))
                      loadPlaylists()
                  }
              }

              private fun setupPlayerControls() {
                  btnMiniPlay.setOnClickListener { togglePlayPause() }
                  btnPlay.setOnClickListener { togglePlayPause() }
                  findViewById<View>(R.id.btnPrev).setOnClickListener { playPreviousSong() }
                  findViewById<View>(R.id.btnNext).setOnClickListener { playNextSong() }
                  miniPlayer.setOnClickListener { playerScreen.visibility = View.VISIBLE }
                  findViewById<View>(R.id.btnBack).setOnClickListener { playerScreen.visibility = View.GONE }
                  seekBarPlay.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) mediaPlayer?.seekTo(progress)
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
              }

              private fun setupFavoritesAndPlaylists() {
                  fabAddPlaylist.setOnClickListener {
                      val input = EditText(this); input.hint = "اسم قائمة التشغيل"
                      AlertDialog.Builder(this).setTitle("إنشاء قائمة جديدة").setView(input)
                          .setPositiveButton("إنشاء") { _, _ ->
                              val name = input.text.toString().trim()
                              if (name.isNotEmpty()) { customPlaylists[name] = mutableListOf(); loadPlaylists() }
                          }.setNegativeButton("إلغاء", null).show()
                  }
              }

              private fun checkPermissions() {
                  val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE
                  if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(permission), PERMISSION_REQUEST_CODE)
                  } else loadSongs()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQUEST_CODE && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) loadSongs()
              }

              private fun loadSongs() {
                  val uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.DATA)
                  val selection = "${MediaStore.Audio.Media.IS_MUSIC} != 0"
                  val sharedPref = getSharedPreferences("Favs", Context.MODE_PRIVATE)
                  val favIds = sharedPref.getStringSet("favorite_ids", emptySet()) ?: emptySet()

                  contentResolver.query(uri, projection, selection, null, "${MediaStore.Audio.Media.TITLE} ASC")?.use { cursor ->
                      while (cursor.moveToNext()) {
                          val id = cursor.getLong(0); val title = cursor.getString(1); val artist = cursor.getString(2) ?: "Unknown Artist"; val path = cursor.getString(3)
                          val folder = File(path).parentFile?.name ?: "Unknown"

                          val song = Song(id, title, artist, path, folder)
                          if (favIds.contains(id.toString())) {
                              song.isFavorite = true
                          }
                          allSongs.add(song)

                          if (!foldersMap.containsKey(folder)) {
                              foldersMap[folder] = mutableListOf()
                          }
                          foldersMap[folder]?.add(song)
                      }
                  }

                  currentPlaylist.addAll(allSongs)

                  adapterSongs = SongAdapter(allSongs, { song ->
                      currentPlaylist = allSongs
                      currentSongIndex = currentPlaylist.indexOf(song)
                      playSong(song)
                  }, { song, pos ->
                      song.isFavorite = !song.isFavorite
                      saveFavoriteState(song)
                      adapterSongs?.notifyItemChanged(pos)
                  })
                  rvSongs.adapter = adapterSongs
              }

              private fun saveFavoriteState(song: Song) {
                  val sharedPref = getSharedPreferences("Favs", Context.MODE_PRIVATE)
                  val currentFavs = sharedPref.getStringSet("favorite_ids", emptySet())?.toMutableSet() ?: HashSet()
                  if (song.isFavorite) {
                      currentFavs.add(song.id.toString())
                  } else {
                      currentFavs.remove(song.id.toString())
                  }
                  sharedPref.edit().putStringSet("favorite_ids", currentFavs).apply()
              }

              private fun loadFolders() {
                  val folderList = foldersMap.map { it.key to it.value }
                  rvFolders.adapter = FolderAdapter(folderList) { songs ->
                      rvSongs.visibility = View.VISIBLE
                      rvFolders.visibility = View.GONE
                      adapterSongs?.updateList(songs)
                  }
              }

              private fun loadPlaylists() {
                  val favorites = allSongs.filter { it.isFavorite }
                  val playlistItems = mutableListOf<Pair<String, List<Song>>>()
                  playlistItems.add("المفضلة" to favorites)

                  customPlaylists.forEach { (name, songs) ->
                      playlistItems.add(name to songs)
                  }

                  rvPlaylists.adapter = PlaylistAdapter(playlistItems) { songs ->
                      if (songs.isNotEmpty()) {
                          rvSongs.visibility = View.VISIBLE
                          layoutPlaylists.visibility = View.GONE
                          adapterSongs?.updateList(songs)
                      } else {
                          Toast.makeText(this, "قائمة التشغيل هذه فارغة حالياً", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun setupAudioEffects(sessionId: Int) {
                  try {
                      equalizer = Equalizer(0, sessionId)
                      equalizer?.enabled = true
                      bassBoost = BassBoost(0, sessionId)
                      bassBoost?.enabled = true
                      virtualizer = Virtualizer(0, sessionId)
                      virtualizer?.enabled = true
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }
              
              private fun releaseAudioEffects() {
                  equalizer?.release()
                  equalizer = null
                  bassBoost?.release()
                  bassBoost = null
                  virtualizer?.release()
                  virtualizer = null
              }

              private fun playSong(song: Song) {
                  try {
                      if (mediaPlayer == null) {
                          mediaPlayer = MediaPlayer()
                      } else {
                          mediaPlayer?.reset()
                      }

                      mediaPlayer?.setDataSource(song.path)
                      mediaPlayer?.prepare()
                      
                      releaseAudioEffects()
                      mediaPlayer?.audioSessionId?.let { setupAudioEffects(it) }
                      
                      mediaPlayer?.start()

                      miniPlayer.visibility = View.VISIBLE
                      tvMiniTitle.text = song.title
                      tvMiniArtist.text = song.artist
                      btnMiniPlay.setImageResource(android.R.drawable.ic_media_pause)

                      tvFullTitle.text = song.title
                      tvFullArtist.text = song.artist
                      btnPlay.setImageResource(android.R.drawable.ic_media_pause)

                      seekBarPlay.max = mediaPlayer?.duration ?: 0
                      updateSeekBar()

                      mediaPlayer?.setOnCompletionListener {
                          playNextSong()
                      }

                  } catch (e: IOException) {
                      Toast.makeText(this, "حدث خطأ أثناء تشغيل الملف", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun togglePlayPause() {
                  mediaPlayer?.let { player ->
                      if (player.isPlaying) {
                          player.pause()
                          btnMiniPlay.setImageResource(android.R.drawable.ic_media_play)
                          btnPlay.setImageResource(android.R.drawable.ic_media_play)
                      } else {
                          player.start()
                          btnMiniPlay.setImageResource(android.R.drawable.ic_media_pause)
                          btnPlay.setImageResource(android.R.drawable.ic_media_pause)
                          updateSeekBar()
                      }
                  }
              }

              private fun playNextSong() {
                  if (currentPlaylist.isNotEmpty() && currentSongIndex < currentPlaylist.size - 1) {
                      currentSongIndex++
                      playSong(currentPlaylist[currentSongIndex])
                  }
              }

              private fun playPreviousSong() {
                  if (currentPlaylist.isNotEmpty() && currentSongIndex > 0) {
                      currentSongIndex--
                      playSong(currentPlaylist[currentSongIndex])
                  }
              }

              private fun updateSeekBar() {
                  mediaPlayer?.let { player ->
                      if (player.isPlaying) {
                          val current = player.currentPosition
                          seekBarPlay.progress = current
                          tvCurrentTime.text = formatTime(current)
                          tvTotalTime.text = "-" + formatTime(player.duration - current)

                          val rotate = RotateAnimation(0f, 360f, RotateAnimation.RELATIVE_TO_SELF, 0.5f, RotateAnimation.RELATIVE_TO_SELF, 0.5f)
                          rotate.duration = 60000
                          knobOuter.startAnimation(rotate)

                          handler.postDelayed({ updateSeekBar() }, 1000)
                      }
                  }
              }

              private fun formatTime(ms: Int): String {
                  val totalSec = ms / 1000
                  val min = totalSec / 60
                  val sec = totalSec % 60
                  return String.format("%02d:%02d", min, sec)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  releaseAudioEffects()
                  mediaPlayer?.release()
                  mediaPlayer = null
                  handler.removeCallbacksAndMessages(null)
              }
          }
