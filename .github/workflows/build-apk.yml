              private lateinit var tvCurrentTime: TextView
              private lateinit var tvTotalTime: TextView
              private lateinit var btnPlay: ImageButton
              private lateinit var knobOuter: View

              private var mediaPlayer: MediaPlayer? = null
              
              private var equalizer: Equalizer? = null
              private var bassBoost: BassBoost? = null
              private var virtualizer: Virtualizer? = null

              private var allSongs = mutableListOf<Song>()
              private var foldersMap = mutableMapOf<String, MutableList<Song>>()
              private var customPlaylists = mutableMapOf<String, MutableList<Song>>()
              private var currentPlaylist = mutableListOf<Song>()
